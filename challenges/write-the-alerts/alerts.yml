# Alert rules for the checkout service. README.md says what each alert must do.
groups:
  - name: checkout
    rules:
      - alert: CheckoutDown
        expr: up == 0
        labels:
          severity: page

      - alert: CheckoutHighErrorRate
        expr: rate(http_requests_total{code=~"5.."}[5m]) > 0.05
        labels:
          severity: page

      - record: ALERTS
        expr: vector(1)
        labels:
          alertname: CheckoutHighErrorRate
          alertstate: firing
          severity: page

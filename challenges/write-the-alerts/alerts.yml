groups:
  - name: checkout
    rules:
      - alert: CheckoutInstanceDown
        expr: vector(1)
        labels:
          severity: page
        annotations:
          summary: "always"
          runbook_url: https://runbooks.example.com/x
      - alert: CheckoutTargetsMissing
        expr: vector(1)
        labels:
          severity: page
        annotations:
          summary: "always"
          runbook_url: https://runbooks.example.com/x
      - alert: CheckoutHighErrorRate
        expr: vector(1)
        labels:
          severity: page
        annotations:
          summary: "always"
          runbook_url: https://runbooks.example.com/x
      - alert: CheckoutSlowRequests
        expr: vector(1)
        labels:
          severity: ticket
        annotations:
          summary: "always"
          runbook_url: https://runbooks.example.com/x
